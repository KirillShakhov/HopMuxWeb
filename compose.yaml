services:
  hopmuxweb:
    build:
      context: .
      args:
        HOPMUX_UID: ${HOPMUX_UID:-10001}
        HOPMUX_GID: ${HOPMUX_GID:-10001}
    network_mode: host
    environment:
      HOPMUX_TOKEN: ${HOPMUX_TOKEN:?Set a strong HOPMUX_TOKEN in .env}
      HOPMUX_BIND: 127.0.0.1
      HOPMUX_PORT: 4444
      HOPMUX_VAULT_FILE: ${HOPMUX_VAULT_FILE:-}
    volumes:
      - ~/.config/mssh:/config
      - ${SSH_DIR:-${HOME}/.ssh}:/home/hopmux/.ssh:ro
      - ./files:/files
      - hopmux-data:/data
    restart: unless-stopped
volumes:
  hopmux-data:
